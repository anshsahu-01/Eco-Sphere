<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eco Sphere - Login/Sign Up</title>
  <link rel="stylesheet" href="./THEME/theme.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}


body {
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.5s, color 0.5s;
  background: linear-gradient(135deg,rgb(136, 255, 177) , rgb(169, 255, 219));
  color: #000000;
  overflow-y: hidden;
}

#typewriter {
  height: 100px;
  font-weight: 900;
  font-size: 25px;
}

/* Main container */
.container {
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 1px 1px 12px rgb(50, 255, 105);
  backdrop-filter: blur(8px);
  border-radius: 20px;
  display: flex;
  width: 65vw;
  height:75vh;
  max-width: 100%;
  overflow-y: hidden;
  translate: 20% 0;
}

.maincontainer{
  width: 90vw;
  height: 100vh;
  padding: 20px 10px;
  /* background-color: rgba(255, 255, 255, 0.1); */
  margin-top: 120px;
  border-radius: 20px;
}

.left-side,
.right-side {
  flex: 1;
  padding: 0px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.left-side {
  background: rgba(255, 255, 255, 0.801); /* Refined saffron to green */
  border-right: 2px solid #000000;
  border-radius: 20px;
  text-align: center;
}


.rocket {
  height: 30vh;
  width: 15vw;
  border-radius: 150px;
  margin-bottom: 30px;
}


.left-side h2 {
  color: #000000;
  font-size: 20px;
}

.login-box {
  width: 100%;
  max-width: 300px;
  text-align: center;
}

.button-box {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  border-radius:20px ;
}

.toggle-btn {
  background: transparent;
  border: none;
  padding: 10px 20px;
  color: #040404;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.toggle-btn.active {
  background: #000000;
  border-radius: 20px;
  color: #ffffff;
}

.toggle-btn:hover{
  border-radius: 20px;
  transition: 0.3s ease;
  background-color: #8a898922;
}


form {
  display: flex;
  flex-direction: column;
}

form input {
  background: rgba(8, 8, 8, 0.673);
  border: none;
  outline: none;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  color: #ffffff;
  font-size: 14px;
  border: 2px solid black;
  display: block;
  width: 99%; /* Width ko adjust kiya gaya */
  margin: 10px auto; /* Centering using auto margins */
  margin-bottom: 20px;
}

form input:hover{
  transition: transform 1s;
  transform: scale(1.05);
}

form a {
  color: #060606;
  text-align: right;
  font-size: 12px;
  margin-bottom: 20px;
  text-decoration: none;
}

.forgot-password {
  display: block;
  margin-top: 10px;
  font-weight: 500;
  font-style: bold;
}

.forgot-password:hover {
  /* transition: transform 4s;
  transform: scale(0.9); */
  color : #d8d7da;
}

body.dark .forgot-password:hover{
    color : #ffffff;
}
.login-btn {
  background: #545252f3;
  border: none;
  padding: 12px;
  color: #ffffff;
  border-radius: 50px;
  cursor: pointer;
  font-size: 20px;
  margin-bottom: 20px;
  border: 2px solid black;
  /* margin-top: 20px; */
  width: 100%; /* Set width to 80% of the container */
  display: block;
  margin-left: auto;
  margin-right: auto; /* Center align the button */
}


.login-btn:hover {
  transition: 0.4s ease;
  color: #000000;
}

.theme-toggle {
  position: fixed;
  top: 20px;       /* 👈 top se 20px */
  right: 20px;     /* 👈 right se 20px */
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  z-index: 9999;
  color: #111;   /* icon color */
  transition: background .2s, color .2s, box-shadow .2s;
  border: none;  /* border remove */
  background-color: #2c2c2c1b;
  box-shadow: 1px 1px 12px #36363698;
}

/* Dark Mode */
body.dark {
  background: #121212;
  color: #fff;
}


body.dark .info-section {
  background: #222;
}

body.dark .info-card1{
  background: #2c2c2c;
  color: #fff;
}
body.dark .info-card2{
  background: #2c2c2c;
  color: #fff;
}
body.dark .info-card3{
  background: #2c2c2c;
  color: #fff;
}
body.dark .info-card4{
  background: #2c2c2c;
  color: #fff;
}
body.dark .info-card5{
  background: #2c2c2c;
  color: #fff;
}

/* Responsive Design */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    padding: 20px 10px;
    margin-top: -5px;margin-left: -0.5%;
    height:130vh;
  }

  .maincontainer{
    flex-direction: column;
    padding: 20px 10px;
    width: 90vw;
    height: 90vh;
    margin-top: 0px;
  }

  #typewriter {
    height: 50px;
    font-size: 18px;
  }

  .left-side,
  .right-side {
    width: 100%;
    padding: 20px;
  }

  .left-side {
    border: 1px solid rgb(0, 0, 0);
    border-radius: 20px;
    margin-top: 50px
  }

  .left-side .rocket {
    width: 150px;
  }

  .left-side h2 {
    font-size: 18px;
  }

  .login-box {
    max-width: 100%;
  }

  .toggle-btn {
    padding: 8px 16px;
  }
}

@media (max-width: 480px) {
    .container {
    flex-direction: column;
    padding: 20px 10px;
    margin-top: -5px;
    margin-left: -0.5%;}
  }
  
  /* .left-side .rocket {
    width: 120px;
  } */

  .left-side h2 {
    font-size: 16px;
  }

  form input {
    font-size: 12px;
    padding: 10px;
  }

  .login-btn {
    font-size: 12px;
    padding: 10px;
  }

  .toggle-btn {
    font-size: 12px;
  }
</style>

<body class="light">
<div class="maincontainer">
  
  <!-- Theme Toggle Button -->
  <div id="themeToggle" class="theme-toggle" role="button" aria-label="Switch theme" tabindex="0" onclick="toggleTheme()">
  <!-- Sun (filled) for light mode -->
  <svg class="icon sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <circle cx="12" cy="12" r="5" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="1"  x2="12" y2="4"/>
      <line x1="12" y1="20" x2="12" y2="23"/>
      <line x1="1"  y1="12" x2="4"  y2="12"/>
      <line x1="20" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="4.22"  x2="6.34" y2="6.34"/>
      <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
      <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
      <line x1="17.66" y1="6.34"  x2="19.78" y2="4.22"/>
    </g>
  </svg>

  <!-- Moon (outline) for dark mode -->
  <svg class="icon moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

  <div class="container">
    <div class="left-side">
      <img src="./Images/logo1.png" alt="Eco Sphere" class="rocket">
      <h2 id="typewriter"></h2>
    </div>

    <div class="right-side">
      <div class="login-box">
        <div class="button-box">
          <button class="toggle-btn active" onclick="showSignIn()">Sign In</button>
          <button class="toggle-btn" onclick="showSignUp()">Sign Up</button>
        </div>

        <!-- Sign In Form -->
        <form id="signInForm" action="dashboard.html">
          <h2>Sign In</h2>
          <input type="text" placeholder="Username" required>
          <input type="password" placeholder="Password" required>
          <a href="forgot.html" class="forgot-password">Forgot Password?</a>
          <button type="submit" class="login-btn">Sign In ➔</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signUpForm" action="dashboard.html" style="display: none;">
          <h2>Sign Up</h2>
          <input type="text" placeholder="Username" required>
          <input type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <input type="password" placeholder="Confirm Password" required>
          <button type="submit" class="login-btn">Sign Up ➔</button>
        </form>
      </div>
    </div>
 

  </section>

  
</div>
  <script src="./THEME/theme.js"></script>
  <script>
const form = document.getElementById('loginForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok && data.success) {
      // Login successful → redirect to dashboard
      window.location.href = './responsive-admin-dashboard-master/dashboard.html';
    } else {
      alert(data.error || 'Login failed');
    }
  } catch (err) {
    console.error(err);
    alert('Server error');
  }
});
</script>
<script src="login.js"></script>

</body>

</html>

</html>
