<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosphere | Sustainable Urban Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            transition: all 0.3s ease;
            max-width: 100%;
    overflow-x: hidden;
        }

        body.dark-theme {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: #ffffff;
        }

        body.light-theme {
            background: linear-gradient(135deg, #f5f5f7 0%, #ffffff 100%);
            color: #333333;
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 0px 280px;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      z-index: 10;
      backdrop-filter: blur(6px);
      transition: background 0.3s ease;
    }

        .dark-theme .theme-toggle {
            background: rgba(255, 255, 255, 0);
            color: #ffffff;
        }

        .light-theme .theme-toggle {
            background: rgba(0, 0, 0, 0);

        }

        .theme-toggle:hover {
            background-color: #a0a0a02a;
        }

        .theme-toggle svg {
            width: 24px;
            height: 24px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .dark-theme .logo {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        .light-theme .logo {
            background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.1rem;
            opacity: 0.8;
            max-width: 400px;
            line-height: 1.6;
        }

        .dark-theme .tagline {
            color: #a0a0a0;
        }

        .light-theme .tagline {
            color: #666666;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 400px;
            margin-top: 40px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .dark-theme .feature {
            background: rgba(255, 255, 255, 0.05);
        }

        .light-theme .feature {
            background: rgba(0, 0, 0, 0.03);
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00ff88, #00ccff);
        }

        .feature-text {
            flex: 1;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .dark-theme .feature-title {
            color: #ffffff;
        }

        .light-theme .feature-title {
            color: #333333;
        }

        .feature-desc {
            font-size: 0.9rem;
            opacity: 0.7;
            line-height: 1.5;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .dark-theme .auth-container {
            background: linear-gradient(135deg, #151515 0%, #1e1e1e 100%);
        }

        .light-theme .auth-container {
            background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .dark-theme .auth-title {
            color: #ffffff;
        }

        .light-theme .auth-title {
            color: #333333;
        }

        .auth-subtitle {
            opacity: 0.7;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .dark-theme .form-label {
            color: #ffffff;
        }

        .light-theme .form-label {
            color: #333333;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .dark-theme .form-input {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .light-theme .form-input {
            background: rgba(0, 0, 0, 0.03);
            color: #333333;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .form-input:focus {
            outline: none;
            border-color: #00ccff;
            box-shadow: 0 0 0 2px rgba(0, 204, 255, 0.2);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.7;
        }

        .dark-theme .toggle-password {
            color: #ffffff;
        }

        .light-theme .toggle-password {
            color: #333333;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .forgot-password {
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .dark-theme .forgot-password {
            color: #00ccff;
        }

        .light-theme .forgot-password {
            color: #0066ff;
        }

        .forgot-password:hover {
            opacity: 0.8;
        }

        .auth-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #000000;
            margin-bottom: 20px;
        }

        .auth-button:hover {
            background-color: #252525;
            color: #ffffff;
            border: 1px solid black;
        }

        .auth-switch {
            text-align: center;
            font-size: 0.9rem;
        }

        .dark-theme .auth-switch {
            color: #a0a0a0;
        }

        .light-theme .auth-switch {
            color: #666666;
        }

        .switch-link {
            color: #00ccff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            cursor: pointer;
        }

        .switch-link:hover {
            opacity: 0.8;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
        }

        .dark-theme .divider-line {
            background: rgba(255, 255, 255, 0.1);
        }

        .light-theme .divider-line {
            background: rgba(0, 0, 0, 0.1);
        }

        .divider-text {
            padding: 0 15px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .social-login {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            
        }
        .social-button1 {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #00ccff;
        }

        .dark-theme .social-button {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
        .dark-theme .social-button1 {
            background: rgba(255, 255, 255, 0.05);
            color: #00ccff;
        }

        .light-theme .social-button {
            background: rgba(0, 0, 0, 0.03);
            color: #333333;
        }

        .social-button:hover {
            transform: translateY(-2px);
        }

        .social-icon {
            width: 18px;
            height: 18px;
        }

@media (max-width: 1200px) {

@media (max-width: 1024px) {

}

@media (max-width: 900px) {

}

@media (max-width: 768px) {
    .container {
        flex-direction: column;
        padding: 0px 20px;
        width: 100%;
        overflow-x: hidden;
    }
    
    body {
        overflow-x: hidden;
        width: 100%;
    }
    
    .left-panel, .right-panel {
        padding: 30px 20px;
        flex: none;
        width: 100%;
        max-width: 100%;
    }
    
    .left-panel {
        padding-top: 60px;
    }
    
    .logo-container {
        margin-bottom: 30px;
        width: 100%;
    }
    
    .logo-text {
        font-size: 2rem;
    }
    
    .features {
        max-width: 100%;
        margin-top: 30px;
        width: 100%;
    }
    
    .auth-container {
        max-width: 100%;
        padding: 30px 25px;
        width: 100%;
        box-sizing: border-box;
    }
    
    .theme-toggle {
        top: 15px;
        right: 15px;
        width: 44px;
        height: 44px;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 0px 15px;
        min-width: 320px;
        max-width: 410px;
        overflow: hidden;
    }
    
    body {
        min-width: 320px;
    }
    
    .left-panel, .right-panel {
        padding: 20px 15px;
        min-width: 0;
    }
    
    .logo {
        width: 70px;
        height: 70px;
    }
    
    .logo-text {
        font-size: 1.8rem;
        word-wrap: break-word;
    }
    
    .tagline {
        font-size: 1rem;
        word-wrap: break-word;
    }
    
    .feature {
        padding: 12px;
        gap: 12px;
        min-width: 0;
    }
    
    .feature-icon {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
    }
    
    .auth-container {
        padding: 25px 20px;
        min-width: 0;
    }
    
    .auth-title {
        font-size: 1.6rem;
        word-wrap: break-word;
    }
    
    .form-input {
        padding: 14px;
        width: 100%;
        box-sizing: border-box;
    }
    
    .remember-forgot {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
        width: 100%;
    }
    
    .social-login {
        flex-direction: column;
        gap: 12px;
        width: 100%;
    }
    
    .social-button {
        padding: 14px;
        width: 100%;
        box-sizing: border-box;
    }
    
    .theme-toggle {
        width: 42px;
        height: 42px;
    }
}

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        // Check for saved theme or prefer-color-scheme
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        body.classList.add(savedTheme + '-theme');
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark-theme')) {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        });

        function updateThemeIcon() {
            const isDark = body.classList.contains('dark-theme');
            themeToggle.innerHTML = isDark ?
                `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
                </svg>`:
                 `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z" fill="currentColor"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>`;
        }

        // Auth Form Toggle Functionality
        const switchLink = document.getElementById('switchLink');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authButton = document.getElementById('authButton');
        const authForm = document.getElementById('authForm');
        const rememberForgot = document.querySelector('.remember-forgot');
        let isLogin = true;

        switchLink.addEventListener('click', () => {
            isLogin = !isLogin;
            
            if (isLogin) {
                authTitle.textContent = 'Welcome Back';
                authSubtitle.textContent = 'Sign in to your Ecosphere account';
                authButton.textContent = 'Sign In';
                switchLink.textContent = 'Sign Up';
                rememberForgot.style.display = 'flex';
            } else {
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Join Ecosphere for sustainable living';
                authButton.textContent = 'Sign Up';
                switchLink.textContent = 'Sign In';
                rememberForgot.style.display = 'none';
            }
        });

        // Password Toggle Functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? 'Show' : 'Hide';
        });

        // Form Submission
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simple validation
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            if (isLogin) {
                // Login logic would go here
                console.log('Logging in with:', { email, password });
                window.location.href = 'dashboard.html';
            } else {
                // Signup logic would go here
                console.log('Signing up with:', { email, password });
                window.location.href = 'dashboard.html';
            }
        });

        // Initialize
        updateThemeIcon();
    </script>
