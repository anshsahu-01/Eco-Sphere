<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eco Sphere - Forgot Password</title>
  <link rel="stylesheet" href="../THEME/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s, color 0.5s;
      background: linear-gradient(135deg, rgb(191, 255, 214), rgb(169, 255, 219));
      color: #000000;
    }

    .forgot-container {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 1px 1px 12px rgb(50, 255, 105);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 40px;
      width: 400px;
      max-width: 90%;
      text-align: center;
    }

    .forgot-container h2 {
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 700;
    }

    .forgot-container p {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .forgot-container input {
      background: rgba(8, 8, 8, 0.673);
      border: 2px solid black;
      outline: none;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      width: 100%;
    }

    .forgot-container input:hover {
      transition: transform 0.5s;
      transform: scale(1.05);
    }

    .reset-btn {
      background: #545252f3;
      border: 2px solid black;
      padding: 12px;
      color: #ffffff;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: 0.3s ease;
    }

    .reset-btn:hover {
      color: #000000;
      background: #e8e8e8;
    }

    .back-link {
      display: block;
      margin-top: 15px;
      text-decoration: none;
      font-size: 14px;
      color: #000;
    }

    .back-link:hover {
      color: #444;
    }

    /* Dark Mode */
    body.dark {
      background: #121212;
      color: #fff;
    }

    body.dark .forgot-container {
      background: #2c2c2c;
      color: #fff;
    }

    body.dark .back-link {
      color: #fff;
    }

    body.dark .reset-btn:hover {
      background: #444;
      color: #fff;
    }

    /* Theme Toggle Button Style */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      z-index: 10;
      backdrop-filter: blur(6px);
      transition: background 0.3s ease;
    }

    /* By default only sun visible */
    .theme-toggle .moon {
      display: none;
    }

    .theme-toggle .sun {
      display: block;
    }

    /* Dark mode me only moon visible */
    body.dark .theme-toggle .sun {
      display: none;
    }

    body.dark .theme-toggle .moon {
      display: block;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>

<body class="light">

  <!-- Theme Toggle Button -->
  <div id="themeToggle" class="theme-toggle" role="button" aria-label="Switch theme" tabindex="0"
    onclick="toggleTheme()">
    <!-- Sun (for light mode) -->
    <svg class="icon sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="5" fill="currentColor" />
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="1" x2="12" y2="4" />
        <line x1="12" y1="20" x2="12" y2="23" />
        <line x1="1" y1="12" x2="4" y2="12" />
        <line x1="20" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" />
        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" />
        <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
      </g>
    </svg>

    <!-- Moon (for dark mode) -->
    <svg class="icon moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  <div class="forgot-container">
    <h2>Forgot Password?</h2>
    <p>Enter your registered email and we'll send you a reset link.</p>
    <form id="forgotForm">
      <input type="email" id="forgotEmail" placeholder="Enter your email" required>
      <button type="submit" class="reset-btn">Send Reset Link</button>
    </form>
    <a href="index.html" class="back-link">← Back to Login</a>
  </div>

  <script src="../THEME/theme.js"></script>
  <script>
    const forgotForm = document.getElementById("forgotForm");
    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("forgotEmail").value;

      try {
        const res = await fetch("/api/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          alert("Reset link sent to your email!");
        } else {
          alert(data.error || "Failed to send reset link");
        }
      } catch (err) {
        console.error(err);
        alert("Server error");
      }
    });
  </script>
  <script src="./THEME/theme.js"></script>
</body>

</html>
