<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosphere | Messages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        body.dark-theme {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: #ffffff;
        }

        body.light-theme {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1e293b;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid;
            position: sticky;
            top: 0;
            z-index: 100;
            background: inherit;
        }

        .dark-theme .header {
            border-color: rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
        }

        .light-theme .header {
            border-color: rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }

        .back-button {
            background: none;
            border: none;
            color: #00ccff;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .back-button:hover {
            background: rgba(0, 204, 255, 0.1);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-button {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            flex-shrink: 0;
        }

        .dark-theme .icon-button {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .light-theme .icon-button {
            background: rgba(0, 0, 0, 0.05);
            color: #475569;
        }

        .icon-button:hover {
            transform: scale(1.05);
            background: rgba(0, 204, 255, 0.2);
        }

        .icon-button svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        /* Main Layout */
        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid;
            flex-shrink: 0;
        }

        .dark-theme .sidebar {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }

        .light-theme .sidebar {
            border-color: rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
        }

        .sidebar-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1.5rem;
            overflow-y: auto;
        }

        /* Search */
        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 0.75rem;
            border: none;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .dark-theme .search-input {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
        }

        .light-theme .search-input {
            background: rgba(255, 255, 255, 0.8);
            color: #1e293b;
            border: 1.5px solid rgba(0, 0, 0, 0.08);
        }

        .search-input:focus {
            outline: none;
            border-color: #00ccff;
            box-shadow: 0 0 0 3px rgba(0, 204, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.7;
        }

        .search-icon svg {
            width: 1rem;
            height: 1rem;
        }

        /* Folders */
        .folders {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .folder-item {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .dark-theme .folder-item {
            color: #cbd5e1;
        }

        .light-theme .folder-item {
            color: #64748b;
        }

        .folder-item:hover, .folder-item.active {
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            color: #000000;
        }

        .folder-icon {
            width: 1.125rem;
            height: 1.125rem;
            flex-shrink: 0;
        }

        .folder-count {
            margin-left: auto;
            font-size: 0.75rem;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.125rem 0.5rem;
            border-radius: 0.625rem;
            min-width: 1.5rem;
            text-align: center;
        }

        .folder-item.active .folder-count {
            background: rgba(0, 0, 0, 0.3);
        }

        /* Messages List */
        .messages-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .messages-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .message-item {
            padding: 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            gap: 0.75rem;
            border: 1px solid transparent;
            min-width: 0;
        }

        .dark-theme .message-item {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .light-theme .message-item {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.05);
        }

        .message-item:hover {
            transform: translateY(-1px);
        }

        .dark-theme .message-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .light-theme .message-item:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message-item.unread {
            border-left: 3px solid #00ccff;
        }

        .message-item.selected {
            background: rgba(0, 204, 255, 0.1);
            border-color: #00ccff;
        }

        .message-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .avatar-ecosphere {
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000000;
        }

        .avatar-support {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
        }

        .avatar-energy {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
        }

        .avatar-water {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #ffffff;
        }

        .message-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .message-sender {
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .message-subject {
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-preview {
            font-size: 0.8rem;
            opacity: 0.8;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-shrink: 0;
        }

        .action-icon {
            padding: 0.375rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon:hover {
            opacity: 1;
            background: rgba(0, 204, 255, 0.1);
        }

        .action-icon svg {
            width: 1rem;
            height: 1rem;
        }

        /* Message View */
        .message-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-left: 1px solid;
        }

        .dark-theme .message-view {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }

        .light-theme .message-view {
            border-color: rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
        }

        .message-header-detail {
            padding: 1.5rem;
            border-bottom: 1px solid;
            flex-shrink: 0;
        }

        .dark-theme .message-header-detail {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .light-theme .message-header-detail {
            border-color: rgba(0, 0, 0, 0.1);
        }

        .message-subject-detail {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .message-sender-detail {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }

        .sender-info {
            min-width: 0;
        }

        .sender-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sender-email {
            font-size: 0.875rem;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 0.9375rem;
        }

        .message-body p {
            margin-bottom: 1rem;
        }

        .message-body ul, .message-body ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        .message-body li {
            margin-bottom: 0.5rem;
        }

        .message-actions-bar {
            padding: 1rem 1.5rem;
            border-top: 1px solid;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .dark-theme .message-actions-bar {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .light-theme .message-actions-bar {
            border-color: rgba(0, 0, 0, 0.1);
        }

        .action-button {
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .dark-theme .action-button {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .light-theme .action-button {
            background: rgba(0, 0, 0, 0.05);
            color: #475569;
        }

        .action-button:hover {
            background: rgba(0, 204, 255, 0.2);
        }

        .action-button.primary {
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #000000;
        }

        .action-button svg {
            width: 1rem;
            height: 1rem;
        }

        /* Empty States */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            text-align: center;
            flex: 1;
        }

        .empty-icon {
            width: 4rem;
            height: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .empty-subtext {
            font-size: 0.875rem;
            opacity: 0.7;
            line-height: 1.5;
        }

        .dark-theme .empty-text {
            color: #cbd5e1;
        }

        .light-theme .empty-text {
            color: #64748b;
        }

        /* Mobile Navigation */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: inherit;
            border-top: 1px solid;
            z-index: 1000;
        }

        .dark-theme .mobile-nav {
            border-color: rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
        }

        .light-theme .mobile-nav {
            border-color: rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        .mobile-nav-items {
            display: flex;
            justify-content: space-around;
            padding: 0.75rem;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem;
            border: none;
            background: none;
            color: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 0.5rem;
            min-width: 4rem;
        }

        .mobile-nav-item.active {
            color: #00ccff;
        }

        .mobile-nav-icon {
            width: 1.25rem;
            height: 1.25rem;
        }

        .mobile-nav-label {
            font-size: 0.75rem;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                width: 250px;
            }
            
            .message-view {
                min-width: 400px;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                height: 100vh;
            }

            .header {
                padding: 1rem;
            }

            .header-title {
                font-size: 1.25rem;
            }

            .main-content {
                flex: 1;
                min-height: 0;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid;
                display: none;
            }

            .sidebar.active {
                display: flex;
            }

            .messages-section {
                display: none;
            }

            .messages-section.active {
                display: flex;
            }

            .message-view {
                display: none;
                border-left: none;
            }

            .message-view.active {
                display: flex;
            }

            .mobile-nav {
                display: block;
            }

            .sidebar-content {
                padding: 1rem;
                gap: 1rem;
            }

            .messages-list {
                padding: 1rem;
            }

            .message-header-detail,
            .message-body,
            .message-actions-bar {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .header-left {
                gap: 0.5rem;
            }

            .back-button {
                padding: 0.375rem 0.5rem;
            }

            .header-title {
                font-size: 1.125rem;
            }

            .icon-button {
                width: 2.5rem;
                height: 2.5rem;
            }

            .message-item {
                padding: 0.75rem;
            }

            .message-avatar {
                width: 2.25rem;
                height: 2.25rem;
            }

            .action-button {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
            }

            .empty-icon {
                width: 3rem;
                height: 3rem;
            }

            .empty-text {
                font-size: 1rem;
            }
        }

        @media (max-width: 360px) {
            .header {
                padding: 0.75rem;
            }

            .sidebar-content,
            .messages-list,
            .message-header-detail,
            .message-body,
            .message-actions-bar {
                padding: 0.75rem;
            }

            .folder-item {
                padding: 0.625rem 0.75rem;
            }

            .message-item {
                padding: 0.625rem;
            }
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .flex {
            display: flex;
        }

        .overflow-auto {
            overflow: auto;
        }

        .min-w-0 {
            min-width: 0;
        }

        .flex-shrink-0 {
            flex-shrink: 0;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="back-button" onclick="window.history.back()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back
                </button>
                <h1 class="header-title">Messages</h1>
            </div>
            <div class="header-actions">
                <button class="icon-button" title="Compose New Message" onclick="composeMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
                <button class="icon-button" id="themeToggle">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar active" id="sidebar">
                <div class="sidebar-content">
                    <!-- Search -->
                    <div class="search-box">
                        <div class="search-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                            </svg>
                        </div>
                        <input type="text" class="search-input" placeholder="Search messages..." id="searchInput">
                    </div>

                    <!-- Folders -->
                    <div class="folders">
                        <div class="folder-item active" data-folder="inbox">
                            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                                <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                            </svg>
                            Inbox
                            <span class="folder-count">12</span>
                        </div>
                        <div class="folder-item" data-folder="sent">
                            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                            </svg>
                            Sent
                            <span class="folder-count">8</span>
                        </div>
                        <div class="folder-item" data-folder="drafts">
                            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                            </svg>
                            Drafts
                            <span class="folder-count">3</span>
                        </div>
                        <div class="folder-item" data-folder="important">
                            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                            Important
                            <span class="folder-count">5</span>
                        </div>
                        <div class="folder-item" data-folder="trash">
                            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Trash
                            <span class="folder-count">24</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Messages List -->
            <div class="messages-section active" id="messagesSection">
                <div class="messages-list" id="messagesList">
                    <!-- Messages will be dynamically inserted here -->
                </div>
            </div>

            <!-- Message View -->
            <div class="message-view" id="messageView">
                <div class="empty-state" id="emptyMessageState">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <div class="empty-text">Select a message to read</div>
                    <div class="empty-subtext">Choose a message from your inbox to view its contents</div>
                </div>

                <!-- Active message view -->
                <div id="activeMessageView" class="hidden">
                    <div class="message-header-detail">
                        <div class="message-subject-detail" id="messageSubjectDetail">Monthly Energy Report</div>
                        <div class="message-meta">
                            <div class="message-sender-detail">
                                <div class="message-avatar avatar-ecosphere" id="messageAvatarDetail">E</div>
                                <div class="sender-info">
                                    <div class="sender-name" id="senderNameDetail">Ecosphere Team</div>
                                    <div class="sender-email" id="senderEmailDetail">noreply@ecosphere.com</div>
                                </div>
                            </div>
                            <div class="message-time" id="messageTimeDetail">2 hours ago</div>
                        </div>
                    </div>
                    <div class="message-body" id="messageBodyDetail">
                        <!-- Message content will be inserted here -->
                    </div>
                    <div class="message-actions-bar">
                        <button class="action-button" onclick="replyToMessage()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                            Reply
                        </button>
                        <button class="action-button" onclick="forwardMessage()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m17 2 4 4-4 4"/>
                                <path d="M3 11v2a4 4 0 0 0 4 4h12"/>
                            </svg>
                            Forward
                        </button>
                        <button class="action-button" onclick="deleteMessage()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="mobile-nav">
            <div class="mobile-nav-items">
                <button class="mobile-nav-item active" data-section="sidebar">
                    <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span class="mobile-nav-label">Folders</span>
                </button>
                <button class="mobile-nav-item" data-section="messagesSection">
                    <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="mobile-nav-label">Messages</span>
                </button>
                <button class="mobile-nav-item" data-section="messageView">
                    <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                    <span class="mobile-nav-label">Read</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        // Check for saved theme or prefer-color-scheme
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        body.classList.add(savedTheme + '-theme');
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark-theme')) {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        });

        function updateThemeIcon() {
            const isDark = body.classList.contains('dark-theme');
            themeToggle.innerHTML = isDark ? 
                `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z" fill="currentColor"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>` :
                `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
                </svg>`;
        }

        // Messages Data
        const messages = [
            {
                id: 1,
                folder: 'inbox',
                sender: 'Ecosphere Team',
                email: 'noreply@ecosphere.com',
                avatar: 'E',
                avatarClass: 'avatar-ecosphere',
                subject: 'Your Monthly Energy Report is Ready',
                preview: 'Your detailed energy consumption analysis for October shows a 15% reduction compared to last month...',
                time: '2 hours ago',
                unread: true,
                starred: false,
                body: `
                    <p>Hello valued Ecosphere user,</p>
                    <p>Your monthly energy consumption report for October is now available. Here are the key highlights:</p>
                    <ul>
                        <li>Total energy consumption: 450 kWh (15% reduction from September)</li>
                        <li>Peak usage time: 6:00 PM - 9:00 PM</li>
                        <li>Estimated savings: $45 compared to last month</li>
                        <li>Carbon footprint reduction: 120 kg CO2</li>
                    </ul>
                    <p>Your most energy-efficient appliance was your smart refrigerator, while your air conditioning system showed the most potential for optimization.</p>
                    <p>To further reduce your energy consumption, consider:</p>
                    <ul>
                        <li>Setting your thermostat to 24°C during sleeping hours</li>
                        <li>Using smart plugs for entertainment systems</li>
                        <li>Scheduling laundry during off-peak hours</li>
                    </ul>
                    <p>Thank you for contributing to a more sustainable future!</p>
                    <p>Best regards,<br>The Ecosphere Team</p>
                `
            },
            {
                id: 2,
                folder: 'inbox',
                sender: 'Energy Support',
                email: 'support@ecosphere-energy.com',
                avatar: 'ES',
                avatarClass: 'avatar-energy',
                subject: 'Unusual Energy Spike Detected',
                preview: 'We detected an unusual energy consumption pattern yesterday between 2:00 PM and 4:00 PM...',
                time: '5 hours ago',
                unread: true,
                starred: true,
                body: `
                    <p>Dear Ecosphere User,</p>
                    <p>Our monitoring system detected an unusual energy consumption pattern in your home yesterday between 2:00 PM and 4:00 PM.</p>
                    <p><strong>Details:</strong></p>
                    <ul>
                        <li>Time: 2:15 PM - 3:45 PM</li>
                        <li>Peak consumption: 3.2 kW (unusual for this time period)</li>
                        <li>Affected circuits: Kitchen and Living Room</li>
                    </ul>
                    <p>This could indicate:</p>
                    <ul>
                        <li>Multiple high-power appliances running simultaneously</li>
                        <li>Potential appliance malfunction</li>
                        <li>Unusual usage pattern</li>
                    </ul>
                    <p>If this was intentional, no action is needed. If unexpected, you may want to check your appliances or contact our support team.</p>
                    <p>Stay efficient!<br>Ecosphere Energy Support</p>
                `
            },
            {
                id: 3,
                folder: 'inbox',
                sender: 'Water Conservation',
                email: 'water@ecosphere.com',
                avatar: 'WC',
                avatarClass: 'avatar-water',
                subject: 'Water Usage Optimization Achieved!',
                preview: 'Congratulations! Your water consumption this week is 20% lower than your neighborhood average...',
                time: '1 day ago',
                unread: false,
                starred: false,
                body: `
                    <p>Congratulations on your water conservation efforts!</p>
                    <p>Your water usage this week shows impressive results:</p>
                    <ul>
                        <li>Weekly consumption: 4,200 liters (20% below neighborhood average)</li>
                        <li>Shower usage: 35% more efficient than last month</li>
                        <li>Garden irrigation: Optimized scheduling saved 300 liters</li>
                    </ul>
                    <p><strong>Your Top Water-Saving Actions:</strong></p>
                    <ol>
                        <li>Shorter shower times (saved 150 liters daily)</li>
                        <li>Efficient dishwasher usage (full loads only)</li>
                        <li>Smart garden irrigation (weather-based scheduling)</li>
                    </ol>
                    <p>Keep up the great work! Your efforts are making a real difference in water conservation.</p>
                    <p>Sustainably yours,<br>Ecosphere Water Team</p>
                `
            }
        ];

        // DOM Elements
        const messagesList = document.getElementById('messagesList');
        const emptyMessageState = document.getElementById('emptyMessageState');
        const activeMessageView = document.getElementById('activeMessageView');
        const folderItems = document.querySelectorAll('.folder-item');
        const searchInput = document.getElementById('searchInput');
        const mobileNavItems = document.querySelectorAll('.mobile-nav-item');
        const sections = {
            sidebar: document.getElementById('sidebar'),
            messagesSection: document.getElementById('messagesSection'),
            messageView: document.getElementById('messageView')
        };

        let currentFolder = 'inbox';
        let selectedMessageId = null;
        let currentMobileSection = 'sidebar';

        // Render Messages
        function renderMessages() {
            messagesList.innerHTML = '';
            
            const filteredMessages = messages.filter(message => {
                const folderMatch = message.folder === currentFolder;
                const searchMatch = searchInput.value === '' || 
                    message.subject.toLowerCase().includes(searchInput.value.toLowerCase()) ||
                    message.sender.toLowerCase().includes(searchInput.value.toLowerCase()) ||
                    message.preview.toLowerCase().includes(searchInput.value.toLowerCase());
                
                return folderMatch && searchMatch;
            });

            if (filteredMessages.length === 0) {
                messagesList.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                        <div class="empty-text">No messages found</div>
                        <div class="empty-subtext">${searchInput.value ? 'Try adjusting your search' : 'Your inbox is empty'}</div>
                    </div>
                `;
                return;
            }

            filteredMessages.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = `message-item ${message.unread ? 'unread' : ''} ${selectedMessageId === message.id ? 'selected' : ''}`;
                messageElement.innerHTML = `
                    <div class="message-avatar ${message.avatarClass}">${message.avatar}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <div class="message-sender">${message.sender}</div>
                            <div class="message-time">${message.time}</div>
                        </div>
                        <div class="message-subject">${message.subject}</div>
                        <div class="message-preview">${message.preview}</div>
                    </div>
                    <div class="message-actions">
                        <div class="action-icon" onclick="event.stopPropagation(); toggleStar(${message.id})">
                            <svg viewBox="0 0 24 24" fill="${message.starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </div>
                    </div>
                `;
                
                messageElement.addEventListener('click', () => {
                    selectMessage(message.id);
                    if (window.innerWidth <= 768) {
                        showMobileSection('messageView');
                    }
                });

                messagesList.appendChild(messageElement);
            });
        }

        // Select Message
        function selectMessage(messageId) {
            selectedMessageId = messageId;
            const message = messages.find(m => m.id === messageId);
            
            if (message) {
                // Mark as read
                message.unread = false;
                
                // Update message view
                document.getElementById('messageSubjectDetail').textContent = message.subject;
                document.getElementById('senderNameDetail').textContent = message.sender;
                document.getElementById('senderEmailDetail').textContent = message.email;
                document.getElementById('messageTimeDetail').textContent = message.time;
                document.getElementById('messageAvatarDetail').className = `message-avatar ${message.avatarClass}`;
                document.getElementById('messageAvatarDetail').textContent = message.avatar;
                document.getElementById('messageBodyDetail').innerHTML = message.body;
                
                // Show active message view
                emptyMessageState.classList.add('hidden');
                activeMessageView.classList.remove('hidden');
                
                // Re-render messages to update read status
                renderMessages();
            }
        }

        // Folder Navigation
        folderItems.forEach(item => {
            item.addEventListener('click', () => {
                folderItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentFolder = item.dataset.folder;
                selectedMessageId = null;
                emptyMessageState.classList.remove('hidden');
                activeMessageView.classList.add('hidden');
                renderMessages();
                
                if (window.innerWidth <= 768) {
                    showMobileSection('messagesSection');
                }
            });
        });

        // Search Functionality
        searchInput.addEventListener('input', renderMessages);

        // Mobile Navigation
        function showMobileSection(section) {
            // Hide all sections
            Object.values(sections).forEach(sec => {
                sec.classList.remove('active');
            });
            
            // Remove active class from all nav items
            mobileNavItems.forEach(item => {
                item.classList.remove('active');
            });
            
            // Show selected section
            sections[section].classList.add('active');
            
            // Activate corresponding nav item
            document.querySelector(`.mobile-nav-item[data-section="${section}"]`).classList.add('active');
            
            currentMobileSection = section;
        }

        mobileNavItems.forEach(item => {
            item.addEventListener('click', () => {
                const section = item.dataset.section;
                showMobileSection(section);
            });
        });

        // Action Functions
        function composeMessage() {
            alert('Compose new message functionality would open here');
        }

        function replyToMessage() {
            if (selectedMessageId) {
                alert(`Reply to message ${selectedMessageId}`);
            }
        }

        function forwardMessage() {
            if (selectedMessageId) {
                alert(`Forward message ${selectedMessageId}`);
            }
        }

        function deleteMessage() {
            if (selectedMessageId) {
                if (confirm('Are you sure you want to delete this message?')) {
                    const index = messages.findIndex(m => m.id === selectedMessageId);
                    if (index !== -1) {
                        messages.splice(index, 1);
                        selectedMessageId = null;
                        emptyMessageState.classList.remove('hidden');
                        activeMessageView.classList.add('hidden');
                        renderMessages();
                    }
                }
            }
        }

        function toggleStar(messageId) {
            const message = messages.find(m => m.id === messageId);
            if (message) {
                message.starred = !message.starred;
                renderMessages();
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                // Show all sections on desktop
                Object.values(sections).forEach(sec => {
                    sec.classList.add('active');
                });
            } else {
                // Show only current mobile section
                showMobileSection(currentMobileSection);
            }
        });

        // Initialize
        updateThemeIcon();
        renderMessages();
        
        // Set initial mobile state
        if (window.innerWidth <= 768) {
            showMobileSection('sidebar');
        }
    </script>
</body>
</html>
